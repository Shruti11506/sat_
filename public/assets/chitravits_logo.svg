<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d37" />
      <stop offset="100%" stop-color="#143b68" />
    </linearGradient>
    <linearGradient id="deltaOrange" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <linearGradient id="deltaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B38" />
      <stop offset="100%" stop-color="#1E4E8C" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ACC1" stop-opacity="0.3" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="chitravits-emblem">
    <!-- Camera Viewfinder Corner Brackets -->
    <path d="M 540 230 L 580 230 L 580 270" fill="none" stroke="#0B1B38" stroke-width="8" stroke-linecap="square" />
    <path d="M 540 460 L 580 460 L 580 420" fill="none" stroke="#0B1B38" stroke-width="8" stroke-linecap="square" />

    <!-- Outer Circular Shutter / Orbit Arc -->
    <!-- Arc from ~top right (angle 40) clockwise around to ~320 deg -->
    <path d="M 465 145 A 210 210 0 1 0 420 560" 
          fill="none" 
          stroke="#0B1B38" 
          stroke-width="20" 
          stroke-linecap="round" />

    <!-- Scanning Satellite (Top-Left Angle) -->
    <g transform="translate(305, 205) rotate(-45)">
      <!-- Main Satellite Bus -->
      <rect x="-22" y="-30" width="44" height="60" rx="8" fill="#0B1B38" stroke="#1E4E8C" stroke-width="3" />
      <!-- Sensor Lens / Antenna -->
      <circle cx="0" cy="35" r="9" fill="#1E88E5" />
      <path d="M -16 35 A 16 16 0 0 1 16 35" fill="none" stroke="#0B1B38" stroke-width="5" />
      
      <!-- Solar Array Left Wing -->
      <line x1="-22" y1="0" x2="-42" y2="0" stroke="#0B1B38" stroke-width="6" />
      <g transform="translate(-86, -24)">
        <rect x="0" y="0" width="44" height="48" rx="4" fill="#0B1B38" />
        <rect x="4" y="4" width="16" height="18" fill="#1E88E5" opacity="0.9" />
        <rect x="24" y="4" width="16" height="18" fill="#1E88E5" opacity="0.9" />
        <rect x="4" y="26" width="16" height="18" fill="#1E88E5" opacity="0.9" />
        <rect x="24" y="26" width="16" height="18" fill="#1E88E5" opacity="0.9" />
      </g>
      
      <!-- Solar Array Right Wing -->
      <line x1="22" y1="0" x2="42" y2="0" stroke="#0B1B38" stroke-width="6" />
      <g transform="translate(42, -24)">
        <rect x="0" y="0" width="44" height="48" rx="4" fill="#0B1B38" />
        <rect x="4" y="4" width="16" height="18" fill="#1E88E5" opacity="0.9" />
        <rect x="24" y="4" width="16" height="18" fill="#1E88E5" opacity="0.9" />
        <rect x="4" y="26" width="16" height="18" fill="#1E88E5" opacity="0.9" />
        <rect x="24" y="26" width="16" height="18" fill="#1E88E5" opacity="0.9" />
      </g>
    </g>

    <!-- Scanning Sensor Cones / Beams onto India -->
    <path d="M 330 230 L 360 325" stroke="#1E88E5" stroke-width="2.5" stroke-dasharray="6,5" />
    <path d="M 345 220 L 420 315" stroke="#00ACC1" stroke-width="2.5" stroke-dasharray="6,5" />
    <path d="M 360 210 L 485 320" stroke="#1E88E5" stroke-width="2.5" stroke-dasharray="6,5" />

    <!-- Earth Observation Globe Circle -->
    <circle cx="430" cy="400" r="105" fill="#FFFFFF" stroke="#0B1B38" stroke-width="8" />

    <!-- HIGH-PRECISION RECOGNIZABLE MAP OF INDIA (Detailed Subcontinent Silhouette) -->
    <g transform="translate(350, 315) scale(0.92)" filter="drop-shadow(0px 2px 4px rgba(11,27,56,0.25))">
      <!-- Detailed Vector Silhouette of India (Kashmir -> Gujarat -> Kanyakumari -> Bengal/Assam) -->
      <path d="
        M 80,18
        C 83,14 88,12 94,15
        C 99,18 104,15 108,21
        C 112,27 106,35 101,40
        C 105,44 114,48 112,54
        C 110,60 102,63 98,68
        C 95,73 98,80 104,83
        C 114,88 128,87 138,89
        C 146,90 158,95 166,97
        C 174,99 184,95 190,101
        C 194,106 186,114 180,117
        C 174,119 168,114 163,118
        C 158,122 160,130 153,132
        C 147,133 142,126 137,126
        C 134,131 138,138 136,144
        C 133,151 124,155 125,163
        C 126,171 131,180 126,186
        C 121,192 113,199 107,206
        C 103,211 96,218 90,222
        C 86,220 83,212 82,204
        C 80,195 73,188 71,179
        C 69,170 70,161 67,152
        C 63,142 57,137 54,127
        C 51,117 40,118 34,123
        C 28,128 20,130 14,124
        C 10,119 15,110 22,108
        C 30,105 38,103 44,97
        C 49,92 46,84 48,77
        C 50,70 57,67 61,61
        C 65,55 68,46 72,40
        C 76,33 77,24 80,18
        Z
      " fill="#0B1B38" />

      <!-- Sri Lanka Teardrop -->
      <ellipse cx="106" cy="226" rx="6" ry="9" transform="rotate(22 106 226)" fill="#0B1B38" />
    </g>

    <!-- Super-Resolution Multispectral Data Pixels (Bursting from East Grid) -->
    <g transform="translate(450, 310)">
      <!-- Column 1 (Dark Navy) -->
      <rect x="0" y="24" width="17" height="17" rx="3" fill="#0B1B38" />
      <rect x="0" y="47" width="17" height="17" rx="3" fill="#0B1B38" />
      <rect x="0" y="70" width="17" height="17" rx="3" fill="#0B1B38" />
      <rect x="0" y="93" width="17" height="17" rx="3" fill="#143B68" />
      <rect x="0" y="116" width="17" height="17" rx="3" fill="#0B1B38" />

      <!-- Column 2 (Ocean & Deep Azure) -->
      <rect x="23" y="0" width="17" height="17" rx="3" fill="#0B1B38" />
      <rect x="23" y="24" width="17" height="17" rx="3" fill="#185294" />
      <rect x="23" y="47" width="17" height="17" rx="3" fill="#0B1B38" />
      <rect x="23" y="70" width="17" height="17" rx="3" fill="#1E88E5" />
      <rect x="23" y="93" width="17" height="17" rx="3" fill="#00897B" />
      <rect x="23" y="116" width="17" height="17" rx="3" fill="#143B68" />

      <!-- Column 3 (Vibrant Azure & Emerald Remote Sensing Bands) -->
      <rect x="46" y="2" width="17" height="17" rx="3" fill="#1E88E5" />
      <rect x="46" y="25" width="17" height="17" rx="3" fill="#0B1B38" />
      <rect x="46" y="48" width="17" height="17" rx="3" fill="#143B68" />
      <rect x="46" y="71" width="17" height="17" rx="3" fill="#2E7D32" />
      <rect x="46" y="94" width="17" height="17" rx="3" fill="#43A047" />

      <!-- Column 4 (Scattering Pixels in Space) -->
      <rect x="69" y="12" width="16" height="16" rx="3" fill="#0B1B38" />
      <rect x="71" y="38" width="15" height="15" rx="3" fill="#1E88E5" />
      <rect x="69" y="62" width="16" height="16" rx="3" fill="#43A047" />
      <rect x="72" y="85" width="14" height="14" rx="3" fill="#66BB6A" />

      <!-- Column 5 (Edge Resolution Pixels) -->
      <rect x="94" y="22" width="13" height="13" rx="2.5" fill="#43A047" />
      <rect x="96" y="52" width="12" height="12" rx="2.5" fill="#66BB6A" />
      <rect x="108" y="72" width="10" height="10" rx="2" fill="#81C784" />
    </g>
  </g>

  <!-- TYPOGRAPHIC LOCKUP: CHITRAVITS -->
  <g id="chitravits-wordmark" transform="translate(400, 640)" text-anchor="middle">
    <!-- Main Title with Custom Jet/Delta Rocket 'A' -->
    <g transform="translate(-290, 0)">
      <!-- C -->
      <path d="M 50,-35 C 22,-35 4,-16 4,12 C 4,40 22,59 50,59 C 64,59 74,54 82,46 L 70,33 C 64,39 57,43 49,43 C 31,43 20,29 20,12 C 20,-5 31,-19 49,-19 C 57,-19 64,-15 70,-9 L 82,-22 C 74,-30 64,-35 50,-35 Z" fill="#0B1B38" />

      <!-- H -->
      <path d="M 98,-32 L 114,-32 L 114,2 L 148,2 L 148,-32 L 164,-32 L 164,56 L 148,56 L 148,18 L 114,18 L 114,56 L 98,56 Z" fill="#0B1B38" />

      <!-- I -->
      <path d="M 180,-32 L 196,-32 L 196,56 L 180,56 Z" fill="#0B1B38" />

      <!-- T -->
      <path d="M 208,-32 L 254,-32 L 254,-17 L 239,-17 L 239,56 L 223,56 L 223,-17 L 208,-17 Z" fill="#0B1B38" />

      <!-- R -->
      <path d="M 268,-32 L 302,-32 C 318,-32 328,-23 328,-9 C 328,2 320,10 308,13 L 332,56 L 314,56 L 292,16 L 284,16 L 284,56 L 268,56 Z M 284,2 L 301,2 C 309,2 313,-2 313,-9 C 313,-16 309,-19 301,-19 L 284,-19 Z" fill="#0B1B38" />

      <!-- SIGNATURE DELTA AEROSPACE ROCKET 'A' (Orange & Navy) -->
      <g transform="translate(336, -34)">
        <!-- Orange Delta Chevron Wing Outer -->
        <path d="M 28,0 L 56,88 L 38,88 L 28,52 L 18,88 L 0,88 Z" fill="url(#deltaOrange)" />
        <!-- Inner Delta Void -->
        <polygon points="28,24 19,56 37,56" fill="#FFFFFF" />
        <!-- Ascending Navy Jet / Satellite Silhouette inside 'A' -->
        <path d="M 28,34 L 32,58 L 28,54 L 24,58 Z" fill="#0B1B38" />
      </g>

      <!-- V -->
      <path d="M 404,-32 L 422,-32 L 439,34 L 456,-32 L 474,-32 L 448,56 L 430,56 Z" fill="#0B1B38" />

      <!-- I -->
      <path d="M 488,-32 L 504,-32 L 504,56 L 488,56 Z" fill="#0B1B38" />

      <!-- T -->
      <path d="M 516,-32 L 562,-32 L 562,-17 L 547,-17 L 547,56 L 531,56 L 531,-17 L 516,-17 Z" fill="#0B1B38" />

      <!-- S -->
      <path d="M 598,-35 C 584,-35 572,-27 572,-13 C 572,5 588,11 602,15 C 614,19 618,23 618,29 C 618,37 608,43 596,43 C 585,43 576,37 573,30 L 558,38 C 564,50 578,59 596,59 C 618,59 634,47 634,29 C 634,11 618,5 604,1 C 592,-3 588,-7 588,-13 C 588,-20 596,-24 606,-24 C 615,-24 623,-19 626,-13 L 639,-23 C 632,-31 621,-35 608,-35 Z" fill="#0B1B38" />
    </g>

    <!-- Divider Lines & Tagline: IMAGING INTELLIGENCE FROM SPACE -->
    <g transform="translate(0, 88)">
      <line x1="-280" y1="-8" x2="-220" y2="-8" stroke="#0B1B38" stroke-width="1.5" opacity="0.6" />
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="7" fill="#0B1B38">
        IMAGING INTELLIGENCE FROM SPACE
      </text>
      <line x1="220" y1="-8" x2="280" y2="-8" stroke="#0B1B38" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- Pillars: SPACE | AI | SUPER-RESOLUTION | EARTH -->
    <g transform="translate(0, 126)" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="4">
      <text x="-210" y="0" fill="#0B1B38">SPACE</text>
      <text x="-140" y="0" fill="#90A4AE">|</text>
      <text x="-95" y="0" fill="#1E88E5">AI</text>
      <text x="-50" y="0" fill="#90A4AE">|</text>
      <text x="50" y="0" fill="#2E7D32">SUPER-RESOLUTION</text>
      <text x="160" y="0" fill="#90A4AE">|</text>
      <text x="215" y="0" fill="#0B1B38">EARTH</text>
    </g>
  </g>
</svg>
